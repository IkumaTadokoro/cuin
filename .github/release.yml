changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - renovate[bot]
      - dependabot[bot]
  categories:
    - title: ✨ New Features
      labels:
        - feature
        - enhancement
    - title: 🐛 Bug Fixes
      labels:
        - bug
        - fix
    - title: 🚀 Performance Improvements
      labels:
        - performance
    - title: 📚 Documentation
      labels:
        - documentation
    - title: 🔧 Maintenance
      labels:
        - chore
        - maintenance
    - title: ⬆️ Dependencies
      labels:
        - dependencies
    - title: Other Changes
      labels:
        - "*"
