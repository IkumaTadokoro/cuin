name: Release

on:
  pull_request:
    branches:
      - main
    types: [closed]

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check Release
    runs-on: ubuntu-latest
    # Only run when Release PR is merged
    if: "github.event.pull_request.merged == true && startsWith(github.event.pull_request.title, 'chore: release')"
    outputs:
      should_publish: ${{ steps.check.outputs.should_publish }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Check if should publish
        id: check
        run: |
          PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
          PUBLISHED_VERSION=$(npm view @ikuma-t/cuin version 2>/dev/null || echo "0.0.0")
          echo "Local version: $PACKAGE_VERSION"
          echo "Published version: $PUBLISHED_VERSION"
          echo "version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
          if [ "$PACKAGE_VERSION" != "$PUBLISHED_VERSION" ]; then
            echo "should_publish=true" >> $GITHUB_OUTPUT
          else
            echo "should_publish=false" >> $GITHUB_OUTPUT
          fi

  build-analyzer:
    name: Build Analyzer (${{ matrix.settings.target }})
    needs: check
    if: needs.check.outputs.should_publish == 'true'
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: x86_64-apple-darwin
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: windows-latest
            target: x86_64-pc-windows-msvc
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - host: ubuntu-latest
            target: aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.settings.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: packages/analyzer
          key: ${{ matrix.settings.target }}

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/analyzer
        run: |
          if [[ "${{ matrix.settings.target }}" == "aarch64-unknown-linux-gnu" ]]; then
            pnpm build --target ${{ matrix.settings.target }} --use-napi-cross
          else
            pnpm build --target ${{ matrix.settings.target }}
          fi
        shell: bash

      - name: Upload artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/analyzer/bindings/*.node
          if-no-files-found: error

      - name: Upload JS bindings
        if: matrix.settings.target == 'x86_64-apple-darwin'
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: js-bindings
          path: |
            packages/analyzer/bindings/index.js
            packages/analyzer/bindings/index.d.ts

  universalize:
    name: Create Universal Binary
    runs-on: macos-latest
    needs: build-analyzer
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download x64 binary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: bindings-x86_64-apple-darwin
          path: packages/analyzer/bindings

      - name: Download arm64 binary
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: bindings-aarch64-apple-darwin
          path: packages/analyzer/bindings

      - name: Create universal binary
        working-directory: packages/analyzer
        run: pnpm napi universalize --output-dir bindings

      - name: Upload universal binary
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: bindings-universal-apple-darwin
          path: packages/analyzer/bindings/*.darwin-universal.node

  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: [check, universalize]
    environment: npm
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"

      # npm 11.5.1+ required for OIDC
      - name: Update npm for OIDC support
        run: |
          echo "Current npm version: $(npm -v)"
          npm install -g npm@latest
          echo "Updated npm version: $(npm -v)"

      - run: pnpm install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          path: packages/analyzer/artifacts

      - name: Download JS bindings
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6.0.0
        with:
          name: js-bindings
          path: packages/analyzer/bindings

      - name: Create npm dirs & move artifacts
        working-directory: packages/analyzer
        run: |
          pnpm napi create-npm-dirs
          pnpm napi artifacts

      # OIDC-based publish with provenance
      - name: Publish @ikuma-t/cuin-analyzer
        working-directory: packages/analyzer
        run: |
          npm config set access public
          pnpm napi pre-publish --tag-style npm --no-gh-release
          pnpm publish --no-git-checks --access public --provenance

      - name: Build UI
        run: pnpm build --filter="@cuin/ui"

      - name: Build CLI
        run: pnpm build --filter="@ikuma-t/cuin"

      - name: Publish @ikuma-t/cuin
        working-directory: packages/cli
        run: pnpm publish --no-git-checks --access public --provenance

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [check, publish]
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v${{ needs.check.outputs.version }}"
          git push origin "v${{ needs.check.outputs.version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@a06a81a03ee405af7f2048a818ed3f03bbf83c7b # v2.5.0
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
