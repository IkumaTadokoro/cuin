name: Release cuin

on:
   push:
      tags:
         - "v*"

permissions:
   contents: write
   id-token: write

concurrency:
   group: ${{ github.workflow }}-${{ github.ref }}
   cancel-in-progress: true

jobs:
   build:
      name: Build ${{ matrix.settings.target }}
      runs-on: ${{ matrix.settings.host }}
      strategy:
         fail-fast: false
         matrix:
            settings:
               - host: macos-latest
                 target: x86_64-apple-darwin
               - host: macos-latest
                 target: aarch64-apple-darwin
               - host: windows-latest
                 target: x86_64-pc-windows-msvc
               - host: ubuntu-latest
                 target: x86_64-unknown-linux-gnu
               - host: ubuntu-latest
                 target: aarch64-unknown-linux-gnu

      steps:
         - uses: actions/checkout@v5.0.0

         - uses: pnpm/action-setup@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm

         - name: Setup Rust
           uses: dtolnay/rust-toolchain@stable
           with:
              toolchain: "1.88.0"
              targets: ${{ matrix.settings.target }}

         - name: Rust Cache
           uses: Swatinem/rust-cache@v2
           with:
              workspaces: packages/analyzer
              key: ${{ matrix.settings.target }}

         - run: pnpm install --frozen-lockfile

         - name: Build
           working-directory: packages/analyzer
           run: |
              if [[ "${{ matrix.settings.target }}" == "aarch64-unknown-linux-gnu" ]]; then
                pnpm build --target ${{ matrix.settings.target }} --use-napi-cross
              else
                pnpm build --target ${{ matrix.settings.target }}
              fi
           shell: bash

         - name: Upload artifact
           uses: actions/upload-artifact@v4
           with:
              name: bindings-${{ matrix.settings.target }}
              path: packages/analyzer/bindings/*.node
              if-no-files-found: error

         - name: Upload JS bindings
           if: matrix.settings.target == 'x86_64-apple-darwin'
           uses: actions/upload-artifact@v4
           with:
              name: js-bindings
              path: |
                 packages/analyzer/bindings/index.js
                 packages/analyzer/bindings/index.d.ts

   universalize:
      name: Create Universal Binary
      runs-on: macos-latest
      needs: build
      steps:
         - uses: actions/checkout@v5
         - uses: pnpm/action-setup@v4
         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm
         - run: pnpm install --frozen-lockfile

         - name: Download x64 binary
           uses: actions/download-artifact@v4
           with:
              name: bindings-x86_64-apple-darwin
              path: packages/analyzer/bindings

         - name: Download arm64 binary
           uses: actions/download-artifact@v4
           with:
              name: bindings-aarch64-apple-darwin
              path: packages/analyzer/bindings

         - name: Create universal binary
           working-directory: packages/analyzer
           run: pnpm napi universalize --output-dir bindings

         - name: Upload universal binary
           uses: actions/upload-artifact@v4
           with:
              name: bindings-universal-apple-darwin
              path: packages/analyzer/bindings/*.darwin-universal.node

   publish-analyzer:
      name: Publish
      runs-on: ubuntu-latest
      needs: [build, universalize]
      steps:
         - uses: actions/checkout@v5.0.0

         - uses: pnpm/action-setup@v4

         - name: Setup Node.js
           uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm
              registry-url: "https://registry.npmjs.org/"

         - run: pnpm install --frozen-lockfile

         - name: Download all artifacts
           uses: actions/download-artifact@v4
           with:
              path: packages/analyzer/artifacts

         - name: Download JS bindings
           uses: actions/download-artifact@v4
           with:
              name: js-bindings
              path: packages/analyzer/bindings

         - name: Create npm dirs & move artifacts
           working-directory: packages/analyzer
           run: |
              pnpm napi create-npm-dirs
              pnpm napi artifacts

         - name: Check if analyzer version changed
           id: check_analyzer_version
           run: |
              PACKAGE_VERSION=$(node -p "require('./packages/analyzer/package.json').version")
              PUBLISHED_VERSION=$(npm view cuin-analyzer version 2>/dev/null || echo "0.0.0")
              echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
              echo "published_version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
              if [ "$PACKAGE_VERSION" != "$PUBLISHED_VERSION" ]; then
                echo "should_publish=true" >> $GITHUB_OUTPUT
                echo "Version changed: $PUBLISHED_VERSION -> $PACKAGE_VERSION"
              else
                echo "should_publish=false" >> $GITHUB_OUTPUT
                echo "Version unchanged: $PACKAGE_VERSION (skipping publish)"
              fi

         - name: PrePublish cuin-analyzer
           if: steps.check_analyzer_version.outputs.should_publish == 'true'
           working-directory: packages/analyzer
           run: pnpm napi pre-publish --tag-style npm --no-gh-release
           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
              GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

         - name: Publish cuin-analyzer
           if: steps.check_analyzer_version.outputs.should_publish == 'true'
           working-directory: packages/analyzer
           run: pnpm publish --no-git-checks --access public
           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

   publish-cuin:
      name: Publish CLI
      runs-on: ubuntu-latest
      needs: [publish-analyzer]
      steps:
         - uses: actions/checkout@v5.0.0
         - uses: pnpm/action-setup@v4

         - uses: actions/setup-node@v4
           with:
              node-version: 22
              cache: pnpm
              registry-url: "https://registry.npmjs.org/"

         - run: pnpm install --frozen-lockfile

         - name: Check if CLI version changed
           id: check_cli_version
           run: |
              PACKAGE_VERSION=$(node -p "require('./packages/cli/package.json').version")
              PUBLISHED_VERSION=$(npm view @ikuma-t/cuin version 2>/dev/null || echo "0.0.0")
              echo "package_version=$PACKAGE_VERSION" >> $GITHUB_OUTPUT
              echo "published_version=$PUBLISHED_VERSION" >> $GITHUB_OUTPUT
              if [ "$PACKAGE_VERSION" != "$PUBLISHED_VERSION" ]; then
                echo "should_publish=true" >> $GITHUB_OUTPUT
                echo "Version changed: $PUBLISHED_VERSION -> $PACKAGE_VERSION"
              else
                echo "should_publish=false" >> $GITHUB_OUTPUT
                echo "Version unchanged: $PACKAGE_VERSION (skipping publish)"
              fi

         - name: Build UI
           if: steps.check_cli_version.outputs.should_publish == 'true'
           run: pnpm build --filter="@cuin/ui"

         - name: Build CLI
           if: steps.check_cli_version.outputs.should_publish == 'true'
           run: pnpm build --filter="@ikuma-t/cuin"

         - name: Publish CLI
           if: steps.check_cli_version.outputs.should_publish == 'true'
           working-directory: packages/cli
           run: pnpm publish --no-git-checks --access public
           env:
              NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
