name: Publish Preview Packages

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  build-analyzer:
    name: Build Analyzer (${{ matrix.settings.target }})
    runs-on: ${{ matrix.settings.host }}
    strategy:
      fail-fast: false
      matrix:
        settings:
          - host: macos-latest
            target: aarch64-apple-darwin
          - host: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: ${{ matrix.settings.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: packages/analyzer
          key: ${{ matrix.settings.target }}

      - run: pnpm install --frozen-lockfile

      - name: Build
        working-directory: packages/analyzer
        run: pnpm build --target ${{ matrix.settings.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: bindings-${{ matrix.settings.target }}
          path: packages/analyzer/bindings/*.node
          if-no-files-found: error

      - name: Upload JS bindings
        if: matrix.settings.target == 'aarch64-apple-darwin'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: js-bindings
          path: |
            packages/analyzer/bindings/index.js
            packages/analyzer/bindings/index.d.ts

  publish-preview:
    name: Publish Preview
    runs-on: ubuntu-latest
    needs: build-analyzer
    steps:
      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0

      - uses: actions/setup-node@395ad3262231945c25e8478fd5baf05154b1d79f # v6.1.0
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Download all artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: packages/analyzer/artifacts

      - name: Download JS bindings
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: js-bindings
          path: packages/analyzer/bindings

      - name: Create npm dirs & move artifacts
        working-directory: packages/analyzer
        run: |
          pnpm napi create-npm-dirs
          pnpm napi artifacts

      - name: Build CLI
        run: pnpm build --filter="@ikuma-t/cuin"

      - name: Publish preview packages
        run: npx pkg-pr-new publish --compact './packages/cuin' './packages/analyzer'
